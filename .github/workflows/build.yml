name: build

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: assembleDebug
        shell: bash
        run: |
          gradle assembleDebug --no-daemon 2>&1 | tee build.log

      - name: compile errors
        if: failure()
        shell: bash
        run: |
          grep -E "^e: |error:" build.log | head -80
